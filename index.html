<!DOCTYPE html>

<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="
      width=device-width,
      initial-scale=1,
      maximum-scale=1,
      user-scalable=no
    "

  <title>
    ANC Agent

  <script src="

  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color: #111827;

    .app {

      margin: auto;

      min-height: 100vh;

      padding-bottom: 80px;

    }


    .topbar {

      background: #ffffff;

      padding: 18px;

      border-bottom:

    }


    .brand {

      font-size: 19px;

      font-weight: 800;

    }


    .agent-name {

      margin-top: 3px;

      font-size: 12px;

      color: #6b7280;

    }


    .page {

      padding: 18px;

    }


    .page-title {

      font-size: 22px;

      font-weight: 800;

      margin-bottom: 18px;

    }


    .dashboard-grid {

      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 12px;

    }


    .stat-card {

      background: #ffffff;

      border:

      border-radius: 18px;

      padding: 17px;

    }


    .stat-icon {

      font-size: 22px;

    }


    .stat-label {

      margin-top: 8px;

      font-size: 12px;

      color: #6b7280;

    }


    .stat-value {

      margin-top: 4px;

      font-size: 24px;

      font-weight: 800;

    }


    .search-box {

      display: flex;

      gap: 8px;

      margin-bottom: 16px;

    }


    .search-input {

      flex: 1;

      min-width: 0;

      border:
        1px solid #d1d5db;

      border-radius: 14px;

      padding:
        13px 14px;

      font-size: 14px;

      outline: none;

    }


    .search-button {

      border: 0;

      border-radius: 14px;

      padding: 0 16px;

      background: #111827;

      color: #ffffff;

      font-weight: 700;

      cursor: pointer;

    }


    .customer-card {

      background: #ffffff;

      border:
        1px solid #e5e7eb;

      border-radius: 17px;

      padding: 15px;

      margin-bottom: 10px;

      cursor: pointer;

    }


    .customer-name {

      font-size: 15px;

      font-weight: 800;

    }


    .customer-info {

      margin-top: 5px;

      font-size: 12px;

      color: #6b7280;

      line-height: 1.6;

    }


    .bottom-nav {

      position: fixed;

      left: 0;

      right: 0;

      bottom: 0;

      height: 64px;

      background: #ffffff;

      border-top:
        1px solid #e5e7eb;

      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      z-index: 100;

    }


    .nav-item {

      border: 0;

      background: transparent;

      color: #9ca3af;

      font-size: 12px;

      font-weight: 700;

      cursor: pointer;

    }


    .nav-item.active {

      color: #111827;

    }


    .loading {

      text-align: center;

      padding: 40px;

      color: #6b7280;

    }


    .error {

      background: #fef2f2;

      color: #991b1b;

      border:
        1px solid #fecaca;

      border-radius: 15px;

      padding: 14px;

      line-height: 1.6;

    }

    /* =====================================
       CUSTOMER DETAIL
    ===================================== */

    /* POLICY */
    
    .agent-policy-card {

    /* FAMILY */
    
    .agent-family-card {

      background: #ffffff;
    
      border: 1px solid #e5e7eb;
    
      border-radius: 15px;
    
      padding: 13px;
    
      margin-bottom: 9px;
    
    }
    
    
    .agent-family-avatar {
    
      width: 38px;
      height: 38px;
    
      border-radius: 50%;
    
      background: #f3f4f6;
    
      display: flex;
    
      align-items: center;
    
      justify-content: center;
    
      font-size: 18px;
    
    }
    
    
    .agent-family-info {
    
      flex: 1;
    
      min-width: 0;
    
    }
    
    
    .agent-family-name {
    
      font-size: 13px;
    
      font-weight: 800;
    
    }
    
    
    .agent-family-relation {
    
      margin-top: 3px;
    
      font-size: 11px;
    
      color: #9ca3af;
    
    }
    
    
    /* EVENT */
    
    .agent-event-card {
    
      display: flex;
    
      align-items: flex-start;
    
      gap: 10px;
    
      background: #ffffff;
    
      border: 1px solid #e5e7eb;
    
      border-radius: 15px;
    
      padding: 13px;
    
      margin-bottom: 9px;
    
    }
    
    
    .agent-event-icon {
    
      width: 36px;
      height: 36px;
    
      border-radius: 10px;
    
      background: #f3f4f6;
    
      display: flex;
    
      align-items: center;
    
      justify-content: center;
    
      flex-shrink: 0;
    
    }
    
    
    .agent-event-content {
    
      min-width: 0;
    
      flex: 1;
    
    }
    
    
    .agent-event-title {
    
      font-size: 13px;
    
      font-weight: 800;
    
    }
    
    
    .agent-event-description {
    
      margin-top: 3px;
    
      font-size: 11px;
    
      color: #6b7280;
    
      line-height: 1.5;
    
    }
    
    
    .agent-event-date {
    
      margin-top: 5px;
    
      font-size: 10px;
    
      color: #9ca3af;
    
    }
    
    
    .agent-empty {
    
      background: #ffffff;
    
      border: 1px solid #e5e7eb;
    
      border-radius: 15px;

  </style>

</head>


<body>

<div id="app"></div>


<script>

const CONFIG = {

  LIFF_ID:
    '2011442900-sIGhnuTJ',

  API_URL:
    'https://script.google.com/macros/s/AKfycbxiaKpavAocuYtKoB_YYke9I_J1r9uTkEmOmcdxb9byJI_15Elzh8qovqMGlbhqqzEq/exec'

};


let agent = null;
let currentPage = 'dashboard';

let selectedCustomerId = null;
let selectedCustomer = null;


async function initAgent() {

  try {

    renderLoading();


    await liff.init({

      liffId:
        CONFIG.LIFF_ID

    });


    if (
      !liff.isLoggedIn() &&
      !liff.isInClient()
    ) {

      liff.login();

      return;

    }


    const idToken =
      liff.getIDToken();


    if (!idToken) {

      throw new Error(
        'ไม่พบ LINE ID Token'
      );

    }


    const result =
      await postAPI({

        action:
          'agentLogin',

        idToken:
          idToken

      });


    if (
      !result.success ||
      !result.authorized
    ) {
    
      console.error(
        'Agent authorization failed:',
        result
      );
    
    
      throw new Error(
        result.message ||
        'บัญชีนี้ไม่มีสิทธิ์ใช้งาน'
      );
    
    }


    agent =
      result.agent;


    renderPage(
      'dashboard'
    );


  }

  catch (error) {

    console.error(
      error
    );


    renderError(
      error.message
    );

  }

}


async function postAPI(
  data
) {

  const response =
    await fetch(
      CONFIG.API_URL,
      {

        method:
          'POST',

        headers: {

          'Content-Type':
            'text/plain;charset=utf-8'

        },

        body:
          JSON.stringify(
            data
          )

      }
    );


  if (!response.ok) {

    throw new Error(
      'API Error'
    );

  }


  return await response.json();

}


function renderPage(page) {

  currentPage = page;


  if (page === 'dashboard') {

    renderDashboard();

  }


  else if (page === 'customers') {

    renderCustomers();

  }


  else if (page === 'customer-detail') {

    renderCustomerDetail();

  }

}


function renderLoading() {

  document
    .getElementById('app')
    .innerHTML = `

      <div class="loading">

        กำลังเข้าสู่
        ANC Agent...

      </div>

    `;

}


function renderError(
  message
) {

  document
    .getElementById('app')
    .innerHTML = `

      <div class="page">

        <div class="error">

          ${escapeHtml(
            message
          )}

        </div>

      </div>

    `;

}


function renderDashboard() {

  document
    .getElementById('app')
    .innerHTML = `

      <div class="app">

        <div class="topbar">

          <div class="brand">
            ANC Life Planning
          </div>

          <div class="agent-name">

            ${
              escapeHtml(
                agent?.AgentName ||
                ''
              )
            }

          </div>

        </div>


        <div class="page">

          <div class="page-title">
            Dashboard
          </div>


          <div class="dashboard-grid">

            <div class="stat-card">

              <div class="stat-icon">
                👥
              </div>

              <div class="stat-label">
                ลูกค้า
              </div>

              <div
                class="stat-value"
                id="customerCount"
              >
                -
              </div>

            </div>


            <div class="stat-card">

              <div class="stat-icon">
                🛡️
              </div>

              <div class="stat-label">
                กรมธรรม์
              </div>

              <div
                class="stat-value"
                id="policyCount"
              >
                -
              </div>

            </div>


            <div class="stat-card">

              <div class="stat-icon">
                🔔
              </div>

              <div class="stat-label">
                Events
              </div>

              <div
                class="stat-value"
                id="eventCount"
              >
                -
              </div>

            </div>


            <div class="stat-card">

              <div class="stat-icon">
                ⚠️
              </div>

              <div class="stat-label">
                รายการติดตาม
              </div>

              <div
                class="stat-value"
                id="followCount"
              >
                -
              </div>

            </div>

          </div>

        </div>


        ${renderBottomNav()}

      </div>

    `;


  loadDashboardStats();

}


function renderCustomers() {

  document
    .getElementById('app')
    .innerHTML = `

      <div class="app">

        <div class="topbar">

          <div class="brand">
            ANC Life Planning
          </div>

          <div class="agent-name">

            ${
              escapeHtml(
                agent?.AgentName ||
                ''
              )
            }

          </div>

        </div>


        <div class="page">

          <div class="page-title">
            ค้นหาลูกค้า
          </div>


          <div class="search-box">

            <input
              id="customerSearchInput"
              class="search-input"
              type="text"
              placeholder="
                ชื่อ / เบอร์โทร /
                เลขกรมธรรม์
              "
              onkeydown="
                if(event.key==='Enter'){
                  searchCustomers();
                }
              "
            >


            <button
              class="search-button"
              onclick="searchCustomers()"
            >
              ค้นหา
            </button>

          </div>


          <div id="customerResults"></div>

        </div>


        ${renderBottomNav()}

      </div>

    `;

}


function renderBottomNav() {

  return `

    <div class="bottom-nav">

      <button
        class="
          nav-item
          ${
            currentPage === 'dashboard'
              ? 'active'
              : ''
          }
        "
        onclick="
          renderPage('dashboard')
        "
      >

        🏠
        <br>
        Dashboard

      </button>


      <button
        class="
          nav-item
          ${
            currentPage === 'customers'
              ? 'active'
              : ''
          }
        "
        onclick="
          renderPage('customers')
        "
      >

        👥
        <br>
        ลูกค้า

      </button>

    </div>

  `;

}


async function searchCustomers() {

  const input =
    document.getElementById(
      'customerSearchInput'
    );


  const keyword =
    input
      ? input.value.trim()
      : '';


  if (!keyword) {

    return;

  }


  const resultBox =
    document.getElementById(
      'customerResults'
    );


  resultBox.innerHTML = `

    <div class="loading">
      กำลังค้นหา...
    </div>

  `;


  try {

    const result =
      await postAPI({

        action:
          'agentSearchCustomers',

        keyword:
          keyword

      });


    const customers =
      result.customers || [];


    if (!customers.length) {

      resultBox.innerHTML = `

        <div class="loading">
          ไม่พบลูกค้า
        </div>

      `;

      return;

    }


    resultBox.innerHTML =

      customers
        .map(
          customer => `

            <div
              class="customer-card"
              onclick="
                openCustomer(
                  '${escapeHtml(
                    customer.CustomerID
                  )}'
                )
              "
            >

              <div class="customer-name">

                ${escapeHtml(
                  customer.DisplayName ||
                  (
                    customer.FirstName +
                    ' ' +
                    customer.LastName
                  )
                )}

              </div>


              <div class="customer-info">

                ${
                  customer.Phone
                    ? `
                      📞
                      ${escapeHtml(
                        customer.Phone
                      )}
                    `
                    : ''
                }

                <br>

                ID:
                ${escapeHtml(
                  customer.CustomerID
                )}

              </div>

            </div>

          `
        )
        .join('');

  }

  catch (error) {

    resultBox.innerHTML = `

      <div class="error">

        ${escapeHtml(
          error.message
        )}

      </div>

    `;

  }

}


async function openCustomer(
  customerId
) {

  selectedCustomerId =
    String(customerId || '').trim();


  if (!selectedCustomerId) {

    return;

  }


  try {

    document
      .getElementById('app')
      .innerHTML = `

        <div class="app">

          <div class="loading">
            กำลังโหลดข้อมูลลูกค้า...
          </div>

        </div>

      `;


    const result =
      await postAPI({

        action:
          'agentGetCustomer',

        customerId:
          selectedCustomerId

      });


    if (!result.success) {

      throw new Error(
        result.message ||
        'ไม่สามารถโหลดข้อมูลลูกค้าได้'
      );

    }


    selectedCustomer =
      result;


    renderPage(
      'customer-detail'
    );

  }

  catch (error) {

    renderError(
      error.message
    );

  }

}


async function loadDashboardStats() {

  try {

    const idToken =
      liff.getIDToken();


    if (!idToken) {
      return;
    }


    const result =
      await postAPI({

        action:
          'agentDashboard',

        idToken:
          idToken

      });


    if (
      !result.success
    ) {

      throw new Error(
        result.message ||
        'ไม่สามารถโหลด Dashboard ได้'
      );

    }


    const stats =
      result.stats || {};


    const customerCount =
      document.getElementById(
        'customerCount'
      );


    const policyCount =
      document.getElementById(
        'policyCount'
      );


    const eventCount =
      document.getElementById(
        'eventCount'
      );


    const followCount =
      document.getElementById(
        'followCount'
      );


    if (customerCount) {

      customerCount.textContent =
        formatNumber(
          stats.customerCount || 0
        );

    }


    if (policyCount) {

      policyCount.textContent =
        formatNumber(
          stats.policyCount || 0
        );

    }


    if (eventCount) {

      eventCount.textContent =
        formatNumber(
          stats.eventCount || 0
        );

    }


    if (followCount) {

      followCount.textContent =
        formatNumber(
          stats.followCount || 0
        );

    }

  }

  catch (error) {

    console.error(
      'loadDashboardStats error:',
      error
    );

  }

}

function renderCustomerDetail() {

  const data =
    selectedCustomer || {};


  const customer =
    data.customer || {};


  const family =
    data.family || [];


  const policies =
    data.policies || [];


  const events =
    data.events || [];


  const ownPolicies =
    policies.filter(policy =>
      !String(
        policy.FamilyMemberID || ''
      ).trim()
    );


  const familyPolicies =
    policies.filter(policy =>
      String(
        policy.FamilyMemberID || ''
      ).trim()
    );


  const displayName =
    customer.DisplayName ||
    (
      (customer.FirstName || '') +
      (
        customer.FirstName &&
        customer.LastName
          ? ' '
          : ''
      ) +
      (customer.LastName || '')
    ) ||
    '-';


  document
    .getElementById('app')
    .innerHTML = `

      <div class="app">


        <div class="topbar">

          <div
            class="agent-back"
            onclick="
              renderPage('customers')
            "
          >
            ← ลูกค้า
          </div>

          <div class="brand">
            ANC Life Planning
          </div>

        </div>


        <div class="page">


          <!-- Customer Header -->

          <div class="agent-customer-header">

            <div
              class="
                agent-customer-avatar
              "
            >
              👤
            </div>


            <div
              class="
                agent-customer-header-info
              "
            >

              <div
                class="
                  agent-customer-name
                "
              >

                ${escapeHtml(
                  displayName
                )}

              </div>


              <div
                class="
                  agent-customer-id
                "
              >

                Customer ID:
                ${escapeHtml(
                  customer.CustomerID ||
                  '-'
                )}

              </div>

            </div>

          </div>


          <!-- Contact -->

          <div class="agent-section-title">
            ข้อมูลลูกค้า
          </div>


          <div class="agent-info-card">

            <div class="agent-info-row">

              <span>
                📞 เบอร์โทร
              </span>

              <strong>

                ${escapeHtml(
                  customer.Phone || '-'
                )}

              </strong>

            </div>


            <div class="agent-info-row">

              <span>
                ✉️ Email
              </span>

              <strong>

                ${escapeHtml(
                  customer.Email || '-'
                )}

              </strong>

            </div>


            <div class="agent-info-row">

              <span>
                🎂 วันเกิด
              </span>

              <strong>

                ${
                  customer.BirthDate
                    ? formatDateDisplay(
                        customer.BirthDate
                      )
                    : '-'
                }

              </strong>

            </div>

          </div>


          <!-- Policies -->

          <div class="agent-section-title">

            🛡️ กรมธรรม์

          </div>


          <div class="agent-stat-line">

            <div>

              กรมธรรม์ของลูกค้า

            </div>

            <strong>

              ${ownPolicies.length}

            </strong>

          </div>


          ${
            ownPolicies.length

              ? `

                ${
                  ownPolicies
                    .map(
                      policy =>
                        renderAgentPolicyCard(
                          policy
                        )
                    )
                    .join('')
                }

              `

              : `

                <div class="agent-empty">

                  ยังไม่มีข้อมูลกรมธรรม์
                  ของลูกค้าในระบบ ANC

                </div>

              `
          }


          <!-- Family -->

          <div class="agent-section-title">

            👨‍👩‍👧‍👦 ครอบครัว

          </div>


          <div class="agent-stat-line">

            <div>
              สมาชิกครอบครัว
            </div>

            <strong>
              ${family.length}
            </strong>

          </div>


          ${
            family.length

              ? `

                ${
                  family
                    .map(
                      member =>
                        renderAgentFamilyCard(
                          member,
                          familyPolicies
                        )
                    )
                    .join('')
                }

              `

              : `

                <div class="agent-empty">

                  ยังไม่มีข้อมูลสมาชิกครอบครัว

                </div>

              `
          }


          <!-- Events -->

          <div class="agent-section-title">

            🔔 Events

          </div>


          ${
            events.length

              ? `

                ${
                  events
                    .slice(0, 5)
                    .map(
                      event =>
                        renderAgentEventCard(
                          event
                        )
                    )
                    .join('')
                }

              `

              : `

                <div class="agent-empty">

                  ไม่มีรายการที่ต้องติดตาม

                </div>

              `
          }

        </div>


        ${renderBottomNav()}

      </div>

    `;

}

function renderAgentPolicyCard(
  policy
) {

  return `

    <div
      class="agent-policy-card"
      onclick="
        alert(
          'Policy ID: ${escapeHtml(
            policy.PolicyID
          )}'
        )
      "
    >

      <div>

        <div class="agent-policy-name">

          ${escapeHtml(
            policy.PlanName || '-'
          )}

        </div>


        <div class="agent-policy-number">

          ${escapeHtml(
            policy.PolicyNo || '-'
          )}

        </div>

      </div>


      <div class="agent-policy-arrow">
        ›
      </div>

    </div>

  `;

}

function renderAgentFamilyCard(
  member,
  familyPolicies
) {

  const memberId =
    String(
      member.FamilyMemberID || ''
    ).trim();


  const policies =
    familyPolicies.filter(policy =>
      String(
        policy.FamilyMemberID || ''
      ).trim() === memberId
    );


  const name =
    member.DisplayName ||
    (
      (member.FirstName || '') +
      (
        member.FirstName &&
        member.LastName
          ? ' '
          : ''
      ) +
      (member.LastName || '')
    ) ||
    '-';


  return `

    <div class="agent-family-card">

      <div
        class="agent-family-avatar"
      >
        👤
      </div>


      <div
        class="agent-family-info"
      >

        <div
          class="agent-family-name"
        >

          ${escapeHtml(name)}

        </div>


        <div
          class="agent-family-relation"
        >

          ${escapeHtml(
            member.Relationship || ''
          )}

          ·

          ${policies.length}
          กรมธรรม์

        </div>

      </div>


      <div class="agent-policy-arrow">
        ›
      </div>

    </div>

  `;

}

function renderAgentEventCard(
  event
) {

  const priority =
    String(
      event.Priority || ''
    ).toUpperCase();


  let icon = '🔵';


  if (priority === 'HIGH') {

    icon = '🔴';

  }

  else if (priority === 'MEDIUM') {

    icon = '🟡';

  }


  return `

    <div class="agent-event-card">

      <div class="agent-event-icon">

        ${icon}

      </div>


      <div
        class="agent-event-content"
      >

        <div
          class="agent-event-title"
        >

          ${escapeHtml(
            event.Title ||
            'รายการสำคัญ'
          )}

        </div>


        <div
          class="agent-event-description"
        >

          ${escapeHtml(
            event.Description || ''
          )}

        </div>


        ${
          event.EventDate
            ? `

              <div
                class="agent-event-date"
              >

                📅
                ${escapeHtml(
                  formatDateDisplay(
                    event.EventDate
                  )
                )}

              </div>

            `
            : ''
        }

      </div>

    </div>

  `;

}


function formatDateDisplay(value) {

  if (!value) {
    return '-';
  }


  const date =
    new Date(value);


  if (isNaN(date.getTime())) {
    return String(value);
  }


  const day =
    String(
      date.getDate()
    ).padStart(2, '0');


  const month =
    String(
      date.getMonth() + 1
    ).padStart(2, '0');


  const year =
    date.getFullYear() + 543;


  return `${day}/${month}/${year}`;

}

function formatNumber(
  value
) {

  return Number(
    value || 0
  ).toLocaleString(
    'th-TH'
  );

}


function escapeHtml(
  value
) {

  return String(
    value ?? ''
  )
  .replace(
    /&/g,
    '&amp;'
  )
  .replace(
    /</g,
    '&lt;'
  )
  .replace(
    />/g,
    '&gt;'
  )
  .replace(
    /"/g,
    '&quot;'
  )
  .replace(
    /'/g,
    '&#039;'
  );

}


document.addEventListener(
  'DOMContentLoaded',
  initAgent
);

</script>

</body>

</html>
