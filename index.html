<!DOCTYPE html>

<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="
      width=device-width,
      initial-scale=1,
      maximum-scale=1,
      user-scalable=no
    "
  >

  <title>
    ANC Agent
  </title>


  <script src="
    https://static.line-scdn.net/liff/edge/2/sdk.js
  "></script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: #f5f7fa;

      color: #111827;

    }


    .app {

      max-width: 600px;

      margin: auto;

      min-height: 100vh;

      padding-bottom: 80px;

    }


    .topbar {

      background: #ffffff;

      padding: 18px;

      border-bottom:
        1px solid #e5e7eb;

    }


    .brand {

      font-size: 19px;

      font-weight: 800;

    }


    .agent-name {

      margin-top: 3px;

      font-size: 12px;

      color: #6b7280;

    }


    .page {

      padding: 18px;

    }


    .page-title {

      font-size: 22px;

      font-weight: 800;

      margin-bottom: 18px;

    }


    .dashboard-grid {

      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 12px;

    }


    .stat-card {

      background: #ffffff;

      border:
        1px solid #e5e7eb;

      border-radius: 18px;

      padding: 17px;

    }


    .stat-icon {

      font-size: 22px;

    }


    .stat-label {

      margin-top: 8px;

      font-size: 12px;

      color: #6b7280;

    }


    .stat-value {

      margin-top: 4px;

      font-size: 24px;

      font-weight: 800;

    }


    .search-box {

      display: flex;

      gap: 8px;

      margin-bottom: 16px;

    }


    .search-input {

      flex: 1;

      min-width: 0;

      border:
        1px solid #d1d5db;

      border-radius: 14px;

      padding:
        13px 14px;

      font-size: 14px;

      outline: none;

    }


    .search-button {

      border: 0;

      border-radius: 14px;

      padding: 0 16px;

      background: #111827;

      color: #ffffff;

      font-weight: 700;

      cursor: pointer;

    }


    .customer-card {

      background: #ffffff;

      border:
        1px solid #e5e7eb;

      border-radius: 17px;

      padding: 15px;

      margin-bottom: 10px;

      cursor: pointer;

    }


    .customer-name {

      font-size: 15px;

      font-weight: 800;

    }


    .customer-info {

      margin-top: 5px;

      font-size: 12px;

      color: #6b7280;

      line-height: 1.6;

    }


    .bottom-nav {

      position: fixed;

      left: 0;

      right: 0;

      bottom: 0;

      height: 64px;

      background: #ffffff;

      border-top:
        1px solid #e5e7eb;

      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      z-index: 100;

    }


    .nav-item {

      border: 0;

      background: transparent;

      color: #9ca3af;

      font-size: 12px;

      font-weight: 700;

      cursor: pointer;

    }


    .nav-item.active {

      color: #111827;

    }


    .loading {

      text-align: center;

      padding: 40px;

      color: #6b7280;

    }


    .error {

      background: #fef2f2;

      color: #991b1b;

      border:
        1px solid #fecaca;

      border-radius: 15px;

      padding: 14px;

      line-height: 1.6;

    }

    /* =====================================
       CUSTOMER DETAIL
    ===================================== */
    
    .agent-back {
    
      font-size: 13px;
    
      color: #6b7280;
    
      margin-bottom: 4px;
    
      cursor: pointer;
    
    }
    
    
    .agent-customer-header {
    
      display: flex;
    
      align-items: center;
    
      gap: 13px;
    
      background: #ffffff;
    
      border: 1px solid #e5e7eb;
    
      border-radius: 18px;
    
      padding: 17px;
    
      margin-bottom: 20px;
    
    }
    
    
    .agent-customer-avatar {
    
      width: 50px;
      height: 50px;
    
      border-radius: 50%;
    
      background: #f3f4f6;
    
      display: flex;
    
      align-items: center;
    
      justify-content: center;
    
      font-size: 24px;
    
    }
    
    
    .agent-customer-header-info {
    
      min-width: 0;
    
      flex: 1;
    
    }
    
    
    .agent-customer-name {
    
      font-size: 17px;
    
      font-weight: 800;
    
    }
    
    
    .agent-customer-id {
    
      margin-top: 4px;
    
      font-size: 11px;
    
      color: #9ca3af;
    
    }
    
    
    .agent-section-title {
    
      font-size: 15px;
    
      font-weight: 800;
    
      margin: 22px 0 10px;
    
    }
    
    
    .agent-info-card {
    
      background: #ffffff;
    
      border: 1px solid #e5e7eb;
    
      border-radius: 16px;
    
      padding: 4px 15px;
    
    }
    
    
    .agent-info-row {
    
      min-height: 48px;
    
      display: flex;
    
      align-items: center;
    
      justify-content: space-between;
    
      gap: 12px;
    
      font-size: 12px;
    
      color: #6b7280;
    
    }
    
    
    .agent-info-row + .agent-info-row {
    
      border-top: 1px solid #f0f0f0;
    
    }
    
    
    .agent-info-row strong {
    
      color: #111827;
    
      text-align: right;
    
      word-break: break-word;
    
    }
    
    
    .agent-stat-line {
    
      display: flex;
    
      justify-content: space-between;
    
      align-items: center;
    
      padding: 12px 14px;
    
      background: #f9fafb;
    
      border-radius: 13px;
    
      margin-bottom: 9px;
    
      font-size: 12px;
    
      color: #6b7280;
    
    }
    
    
    .agent-stat-line strong {
    
      font-size: 17px;
    
      color: #111827;
    
    }
    
    
    /* POLICY */
    
    .agent-policy-card {
    
      display: flex;
    
      align-items: center;
    
      justify-content: space-between;
    
      gap: 12px;
    
      background: #ffffff;
    
      border: 1px solid #e5e7eb;
    
      border-radius: 15px;
    
      padding: 14px;
    
      margin-bottom: 9px;
    
      cursor: pointer;
    
    }
    
    
    .agent-policy-name {
    
      font-size: 13px;
    
      font-weight: 800;
    
    }
    
    
    .agent-policy-number {
    
      margin-top: 3px;
    
      font-size: 11px;
    
      color: #9ca3af;
    
    }
    
    
    .agent-policy-arrow {
    
      font-size: 22px;
    
      color: #9ca3af;
    
    }
    
    
    /* FAMILY */
    
    .agent-family-card {
    
      display: flex;
    
      align-items: center;
    
      gap: 11px;
    
      background: #ffffff;
    
      border: 1px solid #e5e7eb;
    
      border-radius: 15px;
    
      padding: 13px;
    
      margin-bottom: 9px;
    
    }
    
    
    .agent-family-avatar {
    
      width: 38px;
      height: 38px;
    
      border-radius: 50%;
    
      background: #f3f4f6;
    
      display: flex;
    
      align-items: center;
    
      justify-content: center;
    
      font-size: 18px;
    
    }
    
    
    .agent-family-info {
    
      flex: 1;
    
      min-width: 0;
    
    }
    
    
    .agent-family-name {
    
      font-size: 13px;
    
      font-weight: 800;
    
    }
    
    
    .agent-family-relation {
    
      margin-top: 3px;
    
      font-size: 11px;
    
      color: #9ca3af;
    
    }
    
    
    /* EVENT */
    
    .agent-event-card {
    
      display: flex;
    
      align-items: flex-start;
    
      gap: 10px;
    
      background: #ffffff;
    
      border: 1px solid #e5e7eb;
    
      border-radius: 15px;
    
      padding: 13px;
    
      margin-bottom: 9px;
    
    }
    
    
    .agent-event-icon {
    
      width: 36px;
      height: 36px;
    
      border-radius: 10px;
    
      background: #f3f4f6;
    
      display: flex;
    
      align-items: center;
    
      justify-content: center;
    
      flex-shrink: 0;
    
    }
    
    
    .agent-event-content {
    
      min-width: 0;
    
      flex: 1;
    
    }
    
    
    .agent-event-title {
    
      font-size: 13px;
    
      font-weight: 800;
    
    }
    
    
    .agent-event-description {
    
      margin-top: 3px;
    
      font-size: 11px;
    
      color: #6b7280;
    
      line-height: 1.5;
    
    }
    
    
    .agent-event-date {
    
      margin-top: 5px;
    
      font-size: 10px;
    
      color: #9ca3af;
    
    }
    
    
    .agent-empty {
    
      background: #ffffff;
    
      border: 1px solid #e5e7eb;
    
      border-radius: 15px;
    
      padding: 18px;
    
      text-align: center;
    
      color: #9ca3af;
    
      font-size: 12px;
    
    }

    /* =====================================
       AGENT POLICY DETAIL
    ===================================== */
    
    .agent-policy-detail-header {
    
      display: flex;
    
      align-items: center;
    
      gap: 12px;
    
      background: #ffffff;
    
      border: 1px solid #e5e7eb;
    
      border-radius: 18px;
    
      padding: 16px;
    
      margin-bottom: 10px;
    
    }
    
    
    .agent-policy-detail-icon {
    
      width: 48px;
      height: 48px;
    
      border-radius: 14px;
    
      background: #f3f4f6;
    
      display: flex;
    
      align-items: center;
    
      justify-content: center;
    
      font-size: 23px;
    
      flex-shrink: 0;
    
    }
    
    
    .agent-policy-detail-name {
    
      font-size: 16px;
    
      font-weight: 800;
    
      line-height: 1.35;
    
    }
    
    
    .agent-policy-detail-number {
    
      margin-top: 4px;
    
      font-size: 11px;
    
      color: #9ca3af;
    
    }
    
    
    .agent-family-owner-badge {
    
      display: inline-block;
    
      margin-bottom: 8px;
    
      padding: 7px 10px;
    
      background: #f9fafb;
    
      border: 1px solid #e5e7eb;
    
      border-radius: 10px;
    
      font-size: 11px;
    
      color: #6b7280;
    
    }
    
    
    .agent-detail-section {
    
      margin-top: 18px;
    
    }
    
    
    .agent-detail-section-title {
    
      font-size: 14px;
    
      font-weight: 800;
    
      margin-bottom: 9px;
    
    }
    
    
    .agent-policy-status {
    
      display: inline-block;
    
      padding: 6px 10px;
    
      background: #ecfdf5;
    
      color: #166534;
    
      border-radius: 9px;
    
      font-size: 11px;
    
      font-weight: 700;
    
      margin-bottom: 5px;
    
    }
    
    
    .agent-detail-row {
    
      min-height: 43px;
    
      display: flex;
    
      justify-content: space-between;
    
      align-items: center;
    
      gap: 12px;
    
      font-size: 11px;
    
      color: #6b7280;
    
    }
    
    
    .agent-detail-row + .agent-detail-row {
    
      border-top: 1px solid #f1f1f1;
    
    }
    
    
    .agent-detail-row strong {
    
      color: #111827;
    
      font-size: 12px;
    
      text-align: right;
    
    }
    
    
    .agent-coverage-wrap {
    
      margin-bottom: 9px;
    
    }
    
    
    .agent-coverage-item {
    
      display: flex;
    
      align-items: center;
    
      gap: 10px;
    
      background: #ffffff;
    
      border: 1px solid #e5e7eb;
    
      border-radius: 15px;
    
      padding: 13px;
    
    }
    
    
    .agent-coverage-icon {
    
      width: 38px;
      height: 38px;
    
      border-radius: 11px;
    
      background: #f3f4f6;
    
      display: flex;
    
      align-items: center;
    
      justify-content: center;
    
      font-size: 19px;
    
    }
    
    
    .agent-coverage-info {
    
      flex: 1;
    
      min-width: 0;
    
    }
    
    
    .agent-coverage-name {
    
      font-size: 13px;
    
      font-weight: 800;
    
    }
    
    
    .agent-coverage-value {
    
      margin-top: 3px;
    
      font-size: 11px;
    
      color: #6b7280;
    
    }
    
    
    /* USAGE ACCORDION */
    
    .agent-usage-accordion {
    
      margin-top: 5px;
    
      background: #f9fafb;
    
      border: 1px solid #e5e7eb;
    
      border-radius: 13px;
    
      overflow: hidden;
    
    }
    
    
    .agent-usage-header {
    
      width: 100%;
    
      padding: 9px 12px;
    
      border: 0;
    
      background: transparent;
    
      display: flex;
    
      justify-content: space-between;
    
      align-items: center;
    
      color: #6b7280;
    
      font-size: 11px;
    
      font-weight: 700;
    
      cursor: pointer;
    
    }
    
    
    .agent-usage-chevron {
    
      font-size: 18px;
    
      transition: transform .2s ease;
    
    }
    
    
    .agent-usage-accordion.expanded
    .agent-usage-chevron {
    
      transform: rotate(90deg);
    
    }
    
    
    .agent-usage-body {
    
      display: none;
    
      padding: 0 12px 12px;
    
    }
    
    
    .agent-usage-accordion.expanded
    .agent-usage-body {
    
      display: block;
    
    }
    
    
    .agent-usage-row {
    
      min-height: 31px;
    
      display: flex;
    
      justify-content: space-between;
    
      align-items: center;
    
      font-size: 11px;
    
      color: #6b7280;
    
    }
    
    
    .agent-usage-row strong {
    
      color: #374151;
    
      font-size: 11px;
    
    }
    
    
    .agent-usage-remaining {
    
      margin-top: 3px;
    
      padding-top: 7px;
    
      border-top: 1px solid #e5e7eb;
    
    }
    
    
    .agent-usage-remaining strong {
    
      font-size: 15px;
    
      font-weight: 800;
    
    }
    
    
    .agent-usage-progress {
    
      height: 6px;
    
      margin-top: 7px;
    
      background: #e5e7eb;
    
      border-radius: 999px;
    
      overflow: hidden;
    
    }
    
    
    .agent-usage-progress-bar {
    
      height: 100%;
    
      background: #111827;
    
      border-radius: 999px;
    
    }
    
    
    .agent-usage-reset {
    
      display: flex;
    
      justify-content: space-between;
    
      margin-top: 9px;
    
      padding-top: 8px;
    
      border-top: 1px solid #e5e7eb;
    
      font-size: 10px;
    
      color: #9ca3af;
    
    }
    
    
    .agent-usage-reset strong {
    
      color: #374151;
    
    }
    
    
    /* RIDER */
    
    .agent-rider-card {
    
      display: flex;
    
      justify-content: space-between;
    
      align-items: center;
    
      gap: 10px;
    
      padding: 13px;
    
      background: #ffffff;
    
      border: 1px solid #e5e7eb;
    
      border-radius: 15px;
    
      margin-bottom: 9px;
    
    }
    
    
    .agent-rider-name {
    
      font-size: 13px;
    
      font-weight: 800;
    
    }
    
    
    .agent-rider-type {
    
      margin-top: 3px;
    
      font-size: 10px;
    
      color: #9ca3af;
    
    }
    
    
    .agent-rider-coverage {
    
      font-size: 13px;
    
      font-weight: 800;
    
      color: #111827;
    
    }
    
    
    /* WAITING */
    
    .agent-waiting-item {
    
      display: flex;
    
      justify-content: space-between;
    
      align-items: center;
    
      gap: 12px;
    
      padding: 11px 13px;
    
      background: #ffffff;
    
      border: 1px solid #e5e7eb;
    
    }
    
    
    .agent-waiting-item:first-child {
    
      border-radius: 15px 15px 0 0;
    
    }
    
    
    .agent-waiting-item:last-child {
    
      border-radius: 0 0 15px 15px;
    
    }
    
    
    .agent-waiting-item + .agent-waiting-item {
    
      border-top: 0;
    
    }
    
    
    .agent-waiting-name {
    
      font-size: 12px;
    
      font-weight: 700;
    
      color: #374151;
    
      line-height: 1.4;
    
    }
    
    
    .agent-waiting-status {
    
      font-size: 11px;
    
      font-weight: 700;
    
      color: #b45309;
    
      white-space: nowrap;
    
    }
    
    
    .agent-waiting-status.completed {
    
      color: #15803d;
    
    }
    
    
    /* DEDUCTIBLE / COPAY */
    
    .agent-deductible-card,
    .agent-copayment-card {
    
      background: #ffffff;
    
      border: 1px solid #e5e7eb;
    
      border-radius: 15px;
    
      padding: 5px 13px;
    
    }
    
    
    .agent-remaining-row strong {
    
      font-size: 14px;
    
      font-weight: 800;
    
    }
    
    
    .agent-copayment-conditions {
    
      margin-top: 8px;
    
      padding-top: 9px;
    
      border-top: 1px solid #f0f0f0;
    
      font-size: 10px;
    
      color: #6b7280;
    
      line-height: 1.7;
    
    }
    
    
    /* SAVINGS */
    
    .agent-savings-card {
    
      background: #ffffff;
    
      border: 1px solid #e5e7eb;
    
      border-radius: 15px;
    
      padding: 14px;
    
    }
    
    
    .agent-savings-year {
    
      font-size: 18px;
    
      font-weight: 800;
    
      margin-bottom: 8px;
    
    }
    
    
    .agent-savings-progress {
    
      height: 7px;
    
      background: #e5e7eb;
    
      border-radius: 999px;
    
      overflow: hidden;
    
    }
    
    
    .agent-savings-progress-bar {
    
      height: 100%;
    
      background: #111827;
    
      border-radius: 999px;
    
    }
    
    
    .agent-savings-badges {
    
      display: flex;
    
      flex-wrap: wrap;
    
      gap: 6px;
    
      margin: 11px 0;
    
    }
    
    
    .agent-savings-badges span {
    
      padding: 5px 8px;
    
      background: #f3f4f6;
    
      border-radius: 8px;
    
      font-size: 10px;
    
      color: #6b7280;
    
      font-weight: 700;
    
    }

    /* =====================================
       AGENT FAMILY DETAIL
    ===================================== */
    
    .agent-family-detail-header {
    
      display: flex;
    
      align-items: center;
    
      gap: 13px;
    
      background: #ffffff;
    
      border: 1px solid #e5e7eb;
    
      border-radius: 18px;
    
      padding: 17px;
    
      margin-bottom: 4px;
    
    }
    
    
    .agent-family-detail-avatar {
    
      width: 54px;
      height: 54px;
    
      border-radius: 50%;
    
      background: #f3f4f6;
    
      display: flex;
    
      align-items: center;
    
      justify-content: center;
    
      font-size: 25px;
    
      flex-shrink: 0;
    
    }
    
    
    .agent-family-detail-name {
    
      font-size: 17px;
    
      font-weight: 800;
    
      color: #111827;
    
    }
    
    
    .agent-family-detail-relation {
    
      margin-top: 4px;
    
      font-size: 11px;
    
      color: #9ca3af;
    
    }

    /* =====================================
       MANAGE
    ===================================== */
    
    .manage-subtitle {
    
      font-size: 12px;
    
      color: #6b7280;
    
      margin-top: -10px;
    
      margin-bottom: 18px;
    
    }
    
    
    .manage-card {
    
      width: 100%;
    
      display: flex;
    
      align-items: center;
    
      gap: 12px;
    
      border: 1px solid #e5e7eb;
    
      border-radius: 17px;
    
      background: #ffffff;
    
      padding: 15px;
    
      margin-bottom: 10px;
    
      text-align: left;
    
      cursor: pointer;
    
    }
    
    
    .manage-card-icon {
    
      width: 42px;
      height: 42px;
    
      border-radius: 12px;
    
      background: #f3f4f6;
    
      display: flex;
    
      align-items: center;
      justify-content: center;
    
      font-size: 21px;
    
      flex-shrink: 0;
    
    }
    
    
    .manage-card-content {
    
      flex: 1;
    
      min-width: 0;
    
    }
    
    
    .manage-card-title {
    
      font-size: 14px;
    
      font-weight: 800;
    
      color: #111827;
    
    }
    
    
    .manage-card-text {
    
      margin-top: 3px;
    
      font-size: 11px;
    
      color: #6b7280;
    
    }
    
    
    .manage-card-arrow {
    
      font-size: 23px;
    
      color: #9ca3af;
    
    }
    
    
    .manage-card-disabled {
    
      cursor: default;
    
      opacity: 0.55;
    
    }
    
    
    .manage-card-badge {
    
      font-size: 9px;
    
      color: #9ca3af;
    
      white-space: nowrap;
    
    }
    
    
    /* =====================================
       CHOICE
    ===================================== */
    
    .manage-choice-subtitle {
    
      font-size: 13px;
    
      color: #6b7280;
    
      margin-top: -10px;

<body>

<div id="app"></div>


<script>

const CONFIG = {

  LIFF_ID:
    '2011442900-sIGhnuTJ',

  API_URL:
    'https://script.google.com/macros/s/AKfycbxiaKpavAocuYtKoB_YYke9I_J1r9uTkEmOmcdxb9byJI_15Elzh8qovqMGlbhqqzEq/exec'

};


let agent = null;
let currentPage = 'dashboard';

let selectedCustomerId = null;
let selectedCustomer = null;

let selectedPolicyId = null;
let selectedFamilyMemberId = null;
let createPolicyCustomerId = null;

let newPolicyRiders = [];
let editingRiderIndex = -1;
let createPolicyStep = 1;
let createPolicyData = {};


async function initAgent() {

  try {

    renderLoading();


    await liff.init({

      liffId:
        CONFIG.LIFF_ID

    });


    if (
      !liff.isLoggedIn() &&
      !liff.isInClient()
    ) {

      liff.login();

      return;

    }


    const idToken =
      liff.getIDToken();


    if (!idToken) {

      throw new Error(
        'ไม่พบ LINE ID Token'
      );

    }


    const result =
      await postAPI({

        action:
          'agentLogin',

        idToken:
          idToken

      });


    if (
      !result.success ||
      !result.authorized
    ) {
    
      console.error(
        'Agent authorization failed:',
        result
      );
    
    
      throw new Error(
        result.message ||
        'บัญชีนี้ไม่มีสิทธิ์ใช้งาน'
      );
    
    }


    agent =
      result.agent;


    renderPage(
      'dashboard'
    );


  }

  catch (error) {

    console.error(
      error
    );


    renderError(
      error.message
    );

  }

}


async function postAPI(
  data
) {

  const response =
    await fetch(
      CONFIG.API_URL,
      {

        method:
          'POST',

        headers: {

          'Content-Type':
            'text/plain;charset=utf-8'

        },

        body:
          JSON.stringify(
            data
          )

      }
    );


  if (!response.ok) {

    throw new Error(
      'API Error'
    );

  }


  return await response.json();

}


function renderPage(page) {

  currentPage =
    page;


  if (
    page === 'dashboard'
  ) {

    renderDashboard();

  }

  else if (
    page === 'customers'
  ) {

    renderCustomers();

  }

  else if (
    page === 'customer-detail'
  ) {

    renderCustomerDetail();

  }

  else if (
    page === 'policy-detail'
  ) {

    renderAgentPolicyDetail();

  }

  else if (
    page === 'family-detail'
  ) {

    renderAgentFamilyDetail();

  }

  else if (
    page === 'manage'
  ) {

    renderManage();

  }

}


function renderLoading() {

  document
    .getElementById('app')
    .innerHTML = `

      <div class="loading">

        กำลังเข้าสู่
        ANC Agent...

      </div>

    `;

}


function renderError(
  message
) {

  document
    .getElementById('app')
    .innerHTML = `

      <div class="page">

        <div class="error">

          ${escapeHtml(
            message
          )}

        </div>

      </div>

    `;

}


function renderDashboard() {

  document
    .getElementById('app')
    .innerHTML = `

      <div class="app">

        <div class="topbar">

          <div class="topbar-main">
        
            <div>
        
              <div class="brand">
                ANC Life Planning
              </div>

                ${escapeHtml(
                  agent?.AgentName || ''
                )}
        
              </div>
        
            </div>
        
        
            ${renderAgentManageButton()}
        
          </div>
        
        </div>


        <div class="page">

          <div class="page-title">
            Dashboard
          </div>


          <div class="dashboard-grid">

            <div class="stat-card">

              <div class="stat-icon">

              </div>

              </div>

            </div>


            <div class="stat-card">

              </div>

              <div class="stat-label">

              </div>

              <div
                class="stat-value"

                -
              </div>

            </div>


            <div class="stat-card">

              <div class="stat-icon">

              </div>

              <div class="stat-label">
                Events
              </div>

              <div
                class="stat-value"

                -
              </div>

            </div>


            <div class="stat-card">

              <div class="stat-icon">
                ⚠️
              </div>

              <div class="stat-label">
                รายการติดตาม
              </div>

              <div
                class="stat-value"
                id="followCount"
              >
                -
              </div>

            </div>

          </div>

        </div>


        ${renderBottomNav()}

      </div>

    `;


  loadDashboardStats();

}


function renderCustomers() {

  document
    .getElementById('app')
    .innerHTML = `

      <div class="app">

        <div class="topbar">

          <div class="topbar-main">
        
            <div>

            </div>
        
        
            ${renderAgentManageButton()}
        
          </div>
        
        </div>


        <div class="page">

          <div class="page-title">
            ค้นหาลูกค้า
          </div>


          <div class="search-box">

            <input
              id="customerSearchInput"
              class="search-input"
              type="text"
              placeholder="
                ชื่อ / เบอร์โทร /
                เลขกรมธรรม์
              "
              onkeydown="
                if(event.key==='Enter'){
                  searchCustomers();
                }
              "
            >


            <button
              class="search-button"

            </button>

          </div>


          <div id="customerResults"></div>

        </div>


        ${renderBottomNav()}

      </div>

    `;

}

function renderBottomNav() {

  return `

    <div class="bottom-nav">

          nav-item

              ? 'active'
              : ''
          }

        onclick="

        <span class="nav-icon">

              ? 'active'
              : ''
          }
        "
        onclick="

        "

        </span>

  `;

}


async function searchCustomers() {

  const input =
    document.getElementById(
      'customerSearchInput'
    );


  const keyword =
    input
      ? input.value.trim()
      : '';


  if (!keyword) {

    return;

  }


  const resultBox =
    document.getElementById(
      'customerResults'
    );


  resultBox.innerHTML = `

    <div class="loading">
      กำลังค้นหา...
    </div>

  `;


  try {

    const result =
      await postAPI({

        action:
          'agentSearchCustomers',

        keyword:
          keyword

      });


    const customers =
      result.customers || [];


    if (!customers.length) {

      resultBox.innerHTML = `

        <div class="loading">
          ไม่พบลูกค้า
        </div>

      `;

      return;

    }


    resultBox.innerHTML =

      customers
        .map(
          customer => `

            <div
              class="customer-card"
              onclick="
                openCustomer(
                  '${escapeHtml(
                    customer.CustomerID
                  )}'
                )
              "
            >

              <div class="customer-name">

                ${escapeHtml(
                  customer.DisplayName ||
                  (
                    customer.FirstName +
                    ' ' +
                    customer.LastName
                  )
                )}

              </div>


              <div class="customer-info">

                ${
                  customer.Phone
                    ? `
                      📞
                      ${escapeHtml(
                        customer.Phone
                      )}
                    `
                    : ''
                }

                <br>

                ID:
                ${escapeHtml(
                  customer.CustomerID
                )}

              </div>

            </div>

          `
        )
        .join('');

  }

  catch (error) {

    resultBox.innerHTML = `

      <div class="error">

        ${escapeHtml(
          error.message
        )}

      </div>

    `;

  }

}


async function openCustomer(
  customerId
) {

  selectedCustomerId =
    String(customerId || '').trim();


  if (!selectedCustomerId) {

    return;

  }


  try {

    document
      .getElementById('app')
      .innerHTML = `

        <div class="app">

          <div class="loading">
            กำลังโหลดข้อมูลลูกค้า...
          </div>

        </div>

      `;


    const result =
      await postAPI({

        action:
          'agentGetCustomer',

        customerId:
          selectedCustomerId

      });


    if (!result.success) {

      throw new Error(
        result.message ||
        'ไม่สามารถโหลดข้อมูลลูกค้าได้'
      );

    }


    selectedCustomer =
      result;


    renderPage(
      'customer-detail'
    );

  }

  catch (error) {

    renderError(
      error.message
    );

  }

}


async function loadDashboardStats() {

  try {

    const idToken =
      liff.getIDToken();


    if (!idToken) {
      return;
    }


    const result =
      await postAPI({

        action:
          'agentDashboard',

        idToken:
          idToken

      });


    if (
      !result.success
    ) {

      throw new Error(
        result.message ||
        'ไม่สามารถโหลด Dashboard ได้'
      );

    }


    const stats =
      result.stats || {};


    const customerCount =
      document.getElementById(
        'customerCount'
      );


    const policyCount =
      document.getElementById(
        'policyCount'
      );


    const eventCount =
      document.getElementById(
        'eventCount'
      );


    const followCount =
      document.getElementById(
        'followCount'
      );


    if (customerCount) {

      customerCount.textContent =
        formatNumber(
          stats.customerCount || 0
        );

    }


    if (policyCount) {

      policyCount.textContent =
        formatNumber(
          stats.policyCount || 0
        );

    }


    if (eventCount) {

function renderAgentCoverage(

  const name =
    coverage.CoverageName ||

  const icon =
    coverage.Icon ||
    '🛡️';


  const limitType =
    String(
      coverage.LimitType || ''
    ).toUpperCase();


  const hasUsage =
    Number(
      coverage.LimitAmount || 0
    ) > 0 ||
    Number(
      coverage.LimitCount || 0
    ) > 0;


  let mainValue = '';


  if (
    limitType === 'COUNT'
  ) {

    mainValue =
      `${formatAgentNumber(
        coverage.LimitAmount
      )} บาท / ครั้ง`;

  }

  else {

    mainValue =
      `${formatAgentNumber(
        coverage.CoverageAmount
      )} ${
        coverage.CoverageUnit === 'BAHT'
          ? 'บาท'
          : coverage.CoverageUnit || ''
      }`;

  return `

    <div class="agent-coverage-wrap">

        <div class="agent-coverage-icon">

          ${icon}

        <div class="agent-coverage-info">

          </div>


          <div class="agent-coverage-value">

      ${
        hasUsage

              coverage,
              index
            )
          : ''
      }

    </div>

  `;

}

  const accordionId =

    String(
      coverage.LimitType || ''
    ).toUpperCase();


  const limitAmount =
    Number(
      coverage.LimitAmount || 0

    Number(
      coverage.LimitCount || 0

    Number(

    Number(

function renderAgentWaitingPeriods(
  policy
) {

  const raw =
    (policy.riders || [])
      .flatMap(
        rider =>
          rider.waitingPeriods || []
      );


  const seen = new Set();

  const waitingPeriods = [];


  raw.forEach(item => {

    const id =
      String(
        item.WaitingPeriodID || ''
      ).trim();


    const key =
      id ||
      [
        item.WaitingType || '',
        item.WaitingDays || '',
        item.StartDate || '',
        item.EndDate || ''
      ].join('|');


    if (seen.has(key)) {
      return;
    }


    seen.add(key);

    waitingPeriods.push(item);

  });


  if (!waitingPeriods.length) {
    return '';
  }


  return `

    <div
      class="
        agent-detail-section
      "
    >

      <div
        class="
          agent-detail-section-title
        "
      >

        ⏳ ระยะรอคอย

      </div>


      <div
        class="
          agent-waiting-list
        "
      >

        ${
          waitingPeriods
            .map(
              waiting =>
                renderAgentWaitingItem(
                  waiting
                )
            )
            .join('')
        }

      </div>

    </div>

  `;

}

function renderAgentWaitingItem(
  item
) {

  const completed =
    item.Completed === true ||
    String(
      item.Completed || ''
    ).toUpperCase() === 'TRUE';


  let remainingText =
    '';


  if (completed) {

    remainingText =
      '✅ ครบแล้ว';

  }

  else {

    const days =
      Number(
        item.RemainingDays
      );


    if (
      !isNaN(days) &&
      days >= 0
    ) {

      remainingText =
        `เหลือ ${formatAgentNumber(days)} วัน`;

    }

    else {

      remainingText =
        'อยู่ระหว่างรอคอย';

    }

  }


  return `

    <div class="agent-waiting-item">

      <div class="agent-waiting-name">

        ${escapeHtml(
          getAgentWaitingTypeName(
            item.WaitingType
          )
        )}

      </div>


      <div
        class="
          agent-waiting-status
          ${
            completed
              ? 'completed'
              : ''
          }
        "
      >

        ${escapeHtml(
          remainingText
        )}

      </div>

    </div>

  `;

}

    CANCER:
      'มะเร็ง',

    CI:
      'โรคร้ายแรง',

    FAX_CLAIM:
      'Fax Claim (ไม่ต้องสำรองจ่าย สำหรับโรคทั่วไป)',

    OPD_EMERGENCY:
      'OPD อุบัติเหตุฉุกเฉินภายใน 24 ชม.',

    OTHER:
      'อื่น ๆ'

  return (
    names[type] ||
    type ||
    'ระยะรอคอย'

}

function renderAgentSavings(
  policy
) {

  const savings =
    policy?.savings || null;

  if (!savings) {
    return '';
  }


  // ==========================================
  // ข้อมูลหลัก
  // ==========================================

  const paymentTerm =
    Number(
      savings.PaymentTermYears || 0
    );

  const maturityTerm =
    Number(
      savings.MaturityTermYears || 0
    );

  const currentYear =
    Number(
      savings.CurrentPaymentYear || 0
    );


  // ==========================================
  // Progress
  // ==========================================

  let progress = 0;

  if (
    Number.isFinite(
      savings.ProgressPercent
    )
  ) {

    progress =
      Number(
        savings.ProgressPercent
      );

  }

  else if (
    paymentTerm > 0 &&
    currentYear > 0
  ) {

    progress =
      (
        currentYear /
        paymentTerm
      ) * 100;

  }


  progress =
    Math.min(
      100,
      Math.max(
        0,
        progress
      )
    );


  // ==========================================
  // Status
  // ==========================================

  const status =
    String(
      savings.Status || 'ACTIVE'
    )
      .trim()
      .toUpperCase();


  const statusText =
    status === 'ACTIVE'
      ? '✅ กำลังออม'
      : status === 'COMPLETED'
        ? '✅ ครบสัญญา'
        : status === 'CANCELLED'
          ? 'ยกเลิก'
          : status;


  // ==========================================
  // HTML
  // ==========================================

  return `

    <div
      class="agent-detail-section"
    >

      <div
        class="
          agent-detail-section-title
        "
      >
        💰 Savings Progress
      </div>


      <div
        class="agent-savings-card"
      >


        <!-- STATUS -->

        <div
          class="agent-savings-status"
        >
          ${escapeHtml(
            statusText
          )}
        </div>


        <!-- PROGRESS -->

        ${
          paymentTerm > 0
            ? `

              <div
                class="
                  agent-savings-year
                "
              >
                ${
                  currentYear > 0
                    ? `ปีที่ ${formatAgentNumber(currentYear)} / `
                    : ''
                }

                ${formatAgentNumber(
                  paymentTerm
                )}
                ปี
              </div>


              <div
                class="
                  agent-savings-progress
                "
              >

                <div
                  class="
                    agent-savings-progress-bar
                  "
                  style="
                    width:${progress}%;
                  "
                ></div>

              </div>

            `
            : ''
        }


        <!-- BADGES -->

        <div
          class="
            agent-savings-badges
          "
        >

          ${
            paymentTerm > 0
              ? `
                <span>
                  จ่ายเบี้ย
                  ${formatAgentNumber(
                    paymentTerm
                  )}
                  ปี
                </span>
              `
              : ''
          }


          ${
            maturityTerm > 0
              ? `
                <span>
                  ครบสัญญา
                  ${formatAgentNumber(
                    maturityTerm
                  )}
                  ปี
                </span>
              `
              : ''
          }

        </div>


        <!-- PREMIUM END -->

        ${
          savings.PremiumEndDate
            ? `
              ${renderAgentPolicyRow(
                'จ่ายเบี้ยหมด',
                formatDateDisplay(
                  savings.PremiumEndDate
                )
              )}
            `
            : ''
        }


        <!-- MATURITY -->

        ${
          savings.MaturityDate
            ? `
              ${renderAgentPolicyRow(
                'ครบสัญญา',
                formatDateDisplay(
                  savings.MaturityDate
                )
              )}
            `
            : ''
        }


        <!-- MATURITY AMOUNT -->

        ${
          Number(
            savings.MaturityAmount || 0
          ) > 0
            ? `
              ${renderAgentPolicyRow(
                'เงินครบสัญญา',
                `${formatAgentNumber(
                  savings.MaturityAmount
                )} บาท`
              )}
            `
            : ''
        }


        <!-- PAYMENT FREQUENCY -->

        ${
          savings.PaymentFrequency
            ? `
              ${renderAgentPolicyRow(
                'ความถี่ชำระเบี้ย',
                translateAgentPaymentMode(
                  savings.PaymentFrequency
                )
              )}
            `
            : ''
        }


      </div>

    </div>

  `;
}

function translateAgentPaymentMode(
  value
) {

  const mode =
    String(
      value || ''
    )
      .trim()
      .toUpperCase();


  const map = {

    MONTHLY:
      'รายเดือน',

    QUARTER:
      'ราย 3 เดือน',

    HALF_YEAR:
      'ราย 6 เดือน',

    YEARLY:
      'รายปี'

  };


  return (
    map[mode] ||
    value ||
    '-'
  );
}

function formatAgentNumber(
  value
) {

  return Number(
    value || 0
  ).toLocaleString(
    'th-TH'
  );

}

function translateAgentPolicyStatus(
  status
) {

  const value =
    String(
      status || ''
    ).toUpperCase();


  const map = {

    ACTIVE:
      '✅ มีผลคุ้มครอง',

    INACTIVE:
      'ปิดใช้งาน',

    EXPIRED:
      'หมดอายุ',

    CANCELLED:
      'ยกเลิก'

  };


  return (
    map[value] ||
    status ||
    '-'
  );

}

async function submitNewCustomer() {

  const firstName =
    document
      .getElementById(
        'newCustomerFirstName'
      )
      ?.value
      .trim();


  const lastName =
    document
      .getElementById(
        'newCustomerLastName'
      )
      ?.value
      .trim();


  const displayName =
    document
      .getElementById(
        'newCustomerDisplayName'
      )
      ?.value
      .trim();


  const gender =
    document
      .getElementById(
        'newCustomerGender'
      )
      ?.value
      .trim();


  const birthDate =
    document
      .getElementById(
        'newCustomerBirthDate'
      )
      ?.value
      .trim();


  const phone =
    document
      .getElementById(
        'newCustomerPhone'
      )
      ?.value
      .trim();


  const email =
    document
      .getElementById(
        'newCustomerEmail'
      )
      ?.value
      .trim();


  const messageBox =
    document
      .getElementById(
        'newCustomerFormMessage'
      );


  if (!firstName) {

    messageBox.textContent =
      'กรุณากรอกชื่อ';

    return;

  }


  if (!lastName) {

    messageBox.textContent =
      'กรุณากรอกนามสกุล';

    return;

  }


  messageBox.textContent =
    'กำลังบันทึก...';


  try {

    const idToken =
      liff.getIDToken();


    if (!idToken) {

      throw new Error(
        'ไม่พบ LINE ID Token'
      );

    }


    const result =
      await postAPI({

        action:
          'agentCreateCustomer',

        idToken:
          idToken,

        data: {

          FirstName:
            firstName,

          LastName:
            lastName,

          DisplayName:
            displayName,

          Gender:
            gender,

          BirthDate:
            birthDate,

          Phone:
            phone,

          Email:
            email

        }

      });


    if (
      !result.success
    ) {

      if (
        result.duplicate
      ) {

        messageBox.innerHTML = `

          พบลูกค้าที่มีเบอร์โทรนี้แล้ว

          <br>

          Customer ID:
          ${escapeHtml(
            result.customerId ||
            '-'
          )}

        `;

        return;

      }


      throw new Error(
        result.message ||
        'ไม่สามารถบันทึกลูกค้าได้'
      );

    }


    messageBox.innerHTML = `

      <div
        class="form-success"
      >

        ✅ สร้างลูกค้าเรียบร้อยแล้ว

        <br>

        Customer ID:
        <strong>
          ${escapeHtml(
            result.customer.CustomerID
          )}
        </strong>

      </div>

    `;


    /*
     * รอเล็กน้อยแล้ว
     * เปิด Customer Detail
     */

    setTimeout(
      () => {

        openCustomer(
          result.customer.CustomerID
        );

      },
      500
    );


  }

  catch (error) {

    console.error(
      'submitNewCustomer error:',
      error
    );


    messageBox.textContent =
      error.message ||
      'เกิดข้อผิดพลาด';

  }

}

function calculatePolicyYearsBetween(startDate, endDate) {
  if (!startDate || !endDate) return '';

  const start = new Date(String(startDate) + 'T00:00:00');
  const end = new Date(String(endDate) + 'T00:00:00');

  if (isNaN(start.getTime()) || isNaN(end.getTime())) {
    return '';
  }

  let years = end.getFullYear() - start.getFullYear();

  if (years < 0) return '';

  // รูปแบบของระบบ:
  // EffectiveDate + N ปี - 1 วัน = PremiumEndDate
  const anniversary = new Date(
    start.getFullYear() + years,
    start.getMonth(),
    start.getDate()
  );

  const expectedEnd = new Date(anniversary);
  expectedEnd.setDate(expectedEnd.getDate() - 1);

  if (expectedEnd.getTime() === end.getTime()) {
    return years;
  }

  // เผื่อกรณีวันที่ไม่ตรงจากข้อมูลเดิม
  const nextAnniversary = new Date(
    start.getFullYear() + years + 1,
    start.getMonth(),
    start.getDate()
  );

  const nextExpectedEnd = new Date(nextAnniversary);
  nextExpectedEnd.setDate(nextExpectedEnd.getDate() - 1);

  if (nextExpectedEnd.getTime() === end.getTime()) {
    return years + 1;
  }

  return '';
}

function updateCreatePolicyCalculatedDates() {

  const effectiveDate =
    document.getElementById(

      document.getElementById(
        'premiumTermYears'

    )

      .toUpperCase();

    Number(

      )?.value || 0
    );


  const coverageTermYears =
    Number(
      document.getElementById(
        'coverageTermYears'
      )?.value || 0
    );


  const paymentMode =
    String(
      document.getElementById(
        'paymentMode'
      )?.value || 'YEARLY'
    )
      .trim()
      .toUpperCase();


  // ==========================================
  // BirthDate ของผู้เอาประกัน
  // ==========================================

  const birthDate =
    getCreatePolicyOwnerBirthDate();


  // ==========================================
  // Calculate
  // ==========================================

  const result =
    calculatePolicyDates({

      effectiveDate:
        effectiveDate,

      premiumTermYears:
        premiumTermYears,

      coverageMode:
        coverageMode,

      coverageToAge:
        coverageToAge,

      coverageTermYears:
        coverageTermYears,

      paymentMode:
        paymentMode,

      birthDate:
        birthDate

    });


  // ==========================================
  // Display
  // ==========================================

  const premiumBox =
    document.getElementById(
      'calculatedPremiumEndDate'
    );

  const expiryBox =
    document.getElementById(
      'calculatedExpiryDate'
    );

  const nextPaymentBox =
    document.getElementById(
      'calculatedNextPaymentDate'
    );


  if (premiumBox) {

    premiumBox.textContent =
      result.PremiumEndDate
        ? formatDateDisplay(
            result.PremiumEndDate
          )
        : '-';
  }


  if (expiryBox) {

    expiryBox.textContent =
      result.ExpiryDate
        ? formatDateDisplay(
            result.ExpiryDate
          )
        : '-';
  }


  if (nextPaymentBox) {

    nextPaymentBox.textContent =
      result.NextPaymentDate
        ? formatDateDisplay(
            result.NextPaymentDate
          )
        : '-';
  }


  // ==========================================
  // เก็บค่าคำนวณไว้ใน State
  // ==========================================

  createPolicyData =
    createPolicyData || {};


  createPolicyData.PremiumTermYears =
    premiumTermYears;


  createPolicyData.CoverageMode =
    coverageMode;


  createPolicyData.CoverageToAge =
    coverageToAge;


  createPolicyData.CoverageTermYears =
    coverageTermYears;


  createPolicyData.PremiumEndDate =
    result.PremiumEndDate;


  createPolicyData.ExpiryDate =
    result.ExpiryDate;


  createPolicyData.NextPaymentDate =
    result.NextPaymentDate;
}

function formatDateDisplay(value) {

  if (!value) {
    return '-';
  }


  const date =
    new Date(value);


  if (isNaN(date.getTime())) {
    return String(value);
  }


  const day =
    String(
      date.getDate()
    ).padStart(2, '0');


  const month =
    String(
      date.getMonth() + 1
    ).padStart(2, '0');


  const year =
    date.getFullYear() + 543;


  return `${day}/${month}/${year}`;

}

function formatNumber(
  value
) {

  return Number(
    value || 0
  ).toLocaleString(
    'th-TH'
  );

}


function escapeHtml(
  value
) {

  return String(
    value ?? ''
  )
  .replace(
    /&/g,
    '&amp;'
  )
  .replace(
    /</g,
    '&lt;'
  )
  .replace(
    />/g,
    '&gt;'
  )
  .replace(
    /"/g,
    '&quot;'
  )
  .replace(
    /'/g,
    '&#039;'
  );

}


function goCreatePolicyStep2() {

  // ==========================================
  // อ่านข้อมูลหลัก
  // ==========================================

  const policyNo =
    String(
      document.getElementById('policyNo')?.value || ''
    ).trim();

  const policyType =
    String(
      document.getElementById('policyType')?.value || ''
    )
      .trim()
      .toUpperCase();

  const planId =
    String(
      document.getElementById('planId')?.value || ''
    ).trim();

  const planName =
    String(
      document.getElementById('planName')?.value || ''
    ).trim();

  const familyMemberId =
    String(
      document.getElementById('familyMemberId')?.value || ''
    ).trim();

  const lifeSumAssured =
    Number(
      document.getElementById('lifeSumAssured')?.value || 0
    );

  const effectiveDate =
    document.getElementById('effectiveDate')?.value || '';

  const paymentMode =
    String(
      document.getElementById('paymentMode')?.value || 'YEARLY'
    ).trim();

  const annualPremium =
    Number(
      document.getElementById('annualPremium')?.value || 0
    );


  // ==========================================
  // Validate Main Policy
  // ==========================================

  if (!policyNo) {
    alert('กรุณาระบุเลขกรมธรรม์');
    return;
  }

  if (
    !['LIFE', 'SAVINGS'].includes(policyType)
  ) {
    alert('กรุณาเลือกประเภทกรมธรรม์');
    return;
  }

  if (!planName) {
    alert('กรุณาระบุชื่อแผน');
    return;
  }

  if (
    !Number.isFinite(lifeSumAssured) ||
    lifeSumAssured <= 0
  ) {
    alert('กรุณาระบุทุนประกันชีวิตหลัก');
    return;
  }

  if (!effectiveDate) {
    alert('กรุณาระบุวันเริ่มคุ้มครอง');
    return;
  }


  // ==========================================
  // เก็บข้อมูลเดิมไว้
  // สำคัญสำหรับ Back จาก Step 2 -> Step 1
  // ==========================================

  const oldData =
    createPolicyData || {};


  // ==========================================
  // Default
  // ==========================================

  let expiryDate = '';
  let premiumEndDate = '';
  let nextPaymentDate = '';
  let savingsProgress = null;


  // ==========================================
  // LIFE
  // ==========================================

  if (policyType === 'LIFE') {

    const premiumTermYears =
      Number(
        document.getElementById('premiumTermYears')?.value || 0
      );

    const coverageMode =
      String(
        document.getElementById('coverageMode')?.value || 'AGE'
      )
        .trim()
        .toUpperCase();

    const coverageToAge =
      Number(
        document.getElementById('coverageToAge')?.value || 0
      );

    const coverageTermYears =
      Number(
        document.getElementById('coverageTermYears')?.value || 0
      );


    // ========================================
    // Validate LIFE
    // ========================================

    if (
      !Number.isFinite(premiumTermYears) ||
      premiumTermYears <= 0
    ) {
      alert('กรุณาระบุระยะเวลาชำระเบี้ย');
      return;
    }

    if (
      coverageMode === 'AGE' &&
      (
        !Number.isFinite(coverageToAge) ||
        coverageToAge <= 0
      )
    ) {
      alert('กรุณาระบุอายุสิ้นสุดความคุ้มครอง');
      return;
    }

    if (
      coverageMode === 'TERM' &&
      (
        !Number.isFinite(coverageTermYears) ||
        coverageTermYears <= 0
      )
    ) {
      alert('กรุณาระบุระยะเวลาความคุ้มครอง');
      return;
    }


    // ========================================
    // หา BirthDate เจ้าของกรมธรรม์
    // ========================================

    const birthDate =
      getCreatePolicyOwnerBirthDate();


    if (!birthDate) {
      alert('ไม่พบวันเกิดของผู้เอาประกัน');
      return;
    }


    // ========================================
    // คำนวณวันที่
    // ========================================

    const calculatedDates =
      calculatePolicyDates({

        effectiveDate:
          effectiveDate,

        premiumTermYears:
          premiumTermYears,

        coverageMode:
          coverageMode,

        coverageToAge:
          coverageToAge,

        coverageTermYears:
          coverageTermYears,

        paymentMode:
          paymentMode,

        birthDate:
          birthDate

      });


    premiumEndDate =
      calculatedDates.PremiumEndDate;

    expiryDate =
      calculatedDates.ExpiryDate;

    nextPaymentDate =
      calculatedDates.NextPaymentDate;


    if (!premiumEndDate) {
      alert('ไม่สามารถคำนวณวันจ่ายเบี้ยหมดได้');
      return;
    }

    if (!expiryDate) {
      alert('ไม่สามารถคำนวณวันสิ้นสุดความคุ้มครองได้');
      return;
    }

  }


  // ==========================================
  // SAVINGS
  // ==========================================

  if (policyType === 'SAVINGS') {

    const paymentTermYears =
      Number(
        document.getElementById('paymentTermYears')?.value || 0
      );

    const maturityTermYears =
      Number(
        document.getElementById('maturityTermYears')?.value || 0
      );

    const paymentFrequency =
      String(
        document.getElementById(
          'savingsPaymentFrequency'
        )?.value || ''
      ).trim();

    const maturityAmount =
      Number(
        document.getElementById('maturityAmount')?.value || 0
      );


    // ========================================
    // Validate
    // ========================================

    if (
      !Number.isFinite(paymentTermYears) ||
      paymentTermYears <= 0
    ) {
      alert('กรุณาระบุระยะเวลาชำระเบี้ย');
      return;
    }

    if (
      !Number.isFinite(maturityTermYears) ||
      maturityTermYears <= 0
    ) {
      alert('กรุณาระบุระยะเวลาครบสัญญา');
      return;
    }

    if (
      maturityTermYears <
      paymentTermYears
    ) {
      alert(
        'ระยะเวลาครบสัญญาต้องไม่น้อยกว่าระยะเวลาชำระเบี้ย'
      );
      return;
    }

    if (!paymentFrequency) {
      alert('กรุณาเลือกความถี่การชำระ');
      return;
    }

    if (
      !Number.isFinite(maturityAmount) ||
      maturityAmount <= 0
    ) {
      alert('กรุณาระบุเงินครบสัญญา');
      return;
    }


    // ========================================
    // คำนวณ Savings Date อัตโนมัติ
    // ========================================

    const savingsDates =
      calculatePolicyDates({

        effectiveDate:
          effectiveDate,

        premiumTermYears:
          paymentTermYears,

        coverageMode:
          'TERM',

        coverageTermYears:
          maturityTermYears,

        paymentMode:
          paymentFrequency

      });


    premiumEndDate =
      savingsDates.PremiumEndDate;

    expiryDate =
      savingsDates.ExpiryDate;

    nextPaymentDate =
      savingsDates.NextPaymentDate;


    if (!premiumEndDate) {
      alert('ไม่สามารถคำนวณวันจ่ายเบี้ยหมดได้');
      return;
    }

    if (!expiryDate) {
      alert('ไม่สามารถคำนวณวันครบสัญญาได้');
      return;
    }


    // ========================================
    // Savings Progress
    // ========================================

    savingsProgress = {

      StartDate:
        effectiveDate,

      PaymentTermYears:
        paymentTermYears,

      MaturityTermYears:
        maturityTermYears,

      PaymentFrequency:
        paymentFrequency,

      PremiumEndDate:
        premiumEndDate,

      MaturityDate:
        expiryDate,

      MaturityAmount:
        maturityAmount,

      Status:
        'ACTIVE'

    };

  }


  // ==========================================
  // เก็บ State
  // ==========================================

  createPolicyData = {

    ...oldData,

    CustomerID:
      oldData.CustomerID ||
      createPolicyCustomerId,

    customer:
      oldData.customer ||
      oldData.Customer ||
      null,

    family:
      Array.isArray(oldData.family)
        ? oldData.family
        : Array.isArray(oldData.Family)
          ? oldData.Family
          : [],

    PolicyNo:
      policyNo,

    PlanID:
      planId,

    PlanName:
      planName,

    PolicyType:
      policyType,

    FamilyMemberID:
      familyMemberId,

    LifeSumAssured:
      lifeSumAssured,

    EffectiveDate:
      effectiveDate,

    ExpiryDate:
      expiryDate,

    PremiumEndDate:
      premiumEndDate,

    PaymentMode:
      policyType === 'SAVINGS'
        ? String(
            document.getElementById(
              'savingsPaymentFrequency'
            )?.value || paymentMode
          ).trim()
        : paymentMode,

    AnnualPremium:
      Number.isFinite(annualPremium)
        ? annualPremium
        : 0,

    NextPaymentDate:
      nextPaymentDate,

    SavingsProgress:
      savingsProgress

  };


  // ==========================================
  // ไป Step 2
  // ==========================================

  createPolicyStep = 2;

  renderCreatePolicyForm();

}

    document

  // ==========================================
  // Validate
  // ==========================================

  if (!riderId) {

    messageBox.textContent =
      'กรุณาระบุ Rider ID';

    return;
  }


  if (!riderName) {

    messageBox.textContent =
      'กรุณาระบุชื่อ Rider';

    return;
  }


  if (
    !Number.isFinite(coverage) ||
    coverage < 0
  ) {

    messageBox.textContent =
      'ทุน Rider ไม่ถูกต้อง';

    return;
  }


  if (
    !Number.isFinite(premium) ||
    premium < 0
  ) {

    messageBox.textContent =
      'เบี้ย Rider ไม่ถูกต้อง';

    return;
  }


  // ==========================================
  // ป้องกัน Rider ซ้ำ
  // ==========================================

  const duplicateIndex =
    newPolicyRiders.findIndex(
      (item, index) =>
        index !== editingRiderIndex &&
        String(
          item.RiderID || ''
        )
          .trim()
          .toLowerCase() ===
        riderId.toLowerCase()
    );


  if (
    duplicateIndex >= 0
  ) {

    messageBox.textContent =
      'Rider นี้มีอยู่ในรายการแล้ว';

    return;
  }


  // ==========================================
  // สร้าง Rider Object
  // ==========================================

  const rider = {

    RiderID:
      riderId,

    RiderName:
      riderName,

    RiderType:
      riderType,

    Coverage:
      coverage,

    Premium:
      premium

  };


  // ==========================================
  // เพิ่ม / แก้ไข
  // ==========================================

  if (
    editingRiderIndex >= 0
  ) {

    newPolicyRiders[
      editingRiderIndex
    ] = rider;

  } else {

    newPolicyRiders.push(
      rider
    );

  }


  // ==========================================
  // Reset Editor
  // ==========================================

  editingRiderIndex = -1;


  // ==========================================
  // กลับ Step 2
  // ==========================================

  renderCreatePolicyStep2();
}

async function submitCreatePolicy() {

  const messageBox =
    document.getElementById(
      'createPolicyMessage'
    );

  if (!messageBox) {
    return;
  }

  messageBox.textContent =
    'กำลังบันทึก...';


  try {

    // ==========================================
    // LINE ID TOKEN
    // ==========================================

    const idToken =
      liff.getIDToken();

    if (!idToken) {
      throw new Error(
        'ไม่พบ LINE ID Token'
      );
    }


    // ==========================================
    // ตรวจสอบ Customer ID
    // ==========================================

    const customerId =
      String(
        createPolicyData.CustomerID ||
        createPolicyCustomerId ||
        ''
      ).trim();

    if (!customerId) {
      throw new Error(
        'ไม่พบ Customer ID'
      );
    }


    // ==========================================
    // Policy Type
    // ==========================================

    const policyType =
      String(
        createPolicyData.PolicyType ||
        'LIFE'
      )
        .trim()
        .toUpperCase();

    if (
      !['LIFE', 'SAVINGS'].includes(
        policyType
      )
    ) {
      throw new Error(
        'ประเภทกรมธรรม์ไม่ถูกต้อง'
      );
    }


    // ==========================================
    // Riders
    // ==========================================

    const riders =
      Array.isArray(newPolicyRiders)
        ? newPolicyRiders.map(
            rider => ({
              RiderID:
                String(
                  rider.RiderID || ''
                ).trim(),

              RiderName:
                String(
                  rider.RiderName || ''
                ).trim(),

              RiderType:
                String(
                  rider.RiderType || ''
                ).trim(),

              Coverage:
                Number(
                  rider.Coverage || 0
                ),

              Premium:
                Number(
                  rider.Premium || 0
                )
            })
          )
        : [];


    // ==========================================
    // Savings Progress
    // ==========================================

    let savingsProgress = null;

    if (
      policyType === 'SAVINGS'
    ) {

      const savings =
        createPolicyData.SavingsProgress;

      if (!savings) {
        throw new Error(
          'ไม่พบข้อมูล Savings Progress'
        );
      }

      savingsProgress = {
        StartDate:
          savings.StartDate || '',

        PaymentTermYears:
          Number(
            savings.PaymentTermYears || 0
          ),

        MaturityTermYears:
          Number(
            savings.MaturityTermYears || 0
          ),

        PaymentFrequency:
          savings.PaymentFrequency || '',

        PremiumEndDate:
          savings.PremiumEndDate || '',

        MaturityDate:
          savings.MaturityDate || '',

        MaturityAmount:
          Number(
            savings.MaturityAmount || 0
          ),

        Status:
          savings.Status || 'ACTIVE'
      };
    }


    // ==========================================
    // DATA ที่ส่ง Backend
    // ==========================================

    const payload = {

      CustomerID:
        customerId,

      FamilyMemberID:
        createPolicyData.FamilyMemberID ||
        '',

      PolicyNo:
        createPolicyData.PolicyNo ||
        '',

      PlanID:
        createPolicyData.PlanID ||
        '',

      PlanName:
        createPolicyData.PlanName ||
        '',

      PolicyType:
        policyType,

      LifeSumAssured:
        Number(
          createPolicyData.LifeSumAssured || 0
        ),

      EffectiveDate:
        createPolicyData.EffectiveDate ||
        '',

      PremiumEndDate:
        createPolicyData.PremiumEndDate ||
        '',

      ExpiryDate:
        createPolicyData.ExpiryDate ||
        '',

      PaymentMode:
        createPolicyData.PaymentMode ||
        'YEARLY',

      AnnualPremium:
        Number(
          createPolicyData.AnnualPremium || 0
        ),

      NextPaymentDate:
        createPolicyData.NextPaymentDate ||
        '',

      SavingsProgress:
        savingsProgress,

      Riders:
        riders

    };


    console.log(
      'CREATE POLICY PAYLOAD:',
      payload
    );


    // ==========================================
    // CALL API
    // ==========================================

    const result =
      await postAPI({

        action:
          'agentCreatePolicyWithRiders',

        idToken:
          idToken,

        data:
          payload

      });


    // ==========================================
    // RESULT
    // ==========================================

    if (
      !result ||
      !result.success
    ) {
    
      console.error(
        'agentCreatePolicyWithRiders result:',
        result
      );
    
      if (
        result &&
        result.duplicate
      ) {
    
        messageBox.textContent =
          `เลขกรมธรรม์นี้มีอยู่แล้ว (${result.policyId})`;
    
        return;
      }
    
      throw new Error(
        result?.message ||
        JSON.stringify(result) ||
        'ไม่สามารถบันทึกกรมธรรม์ได้'
      );
    }


    // ==========================================
    // SUCCESS
    // ==========================================

    const policyId =
      result.policy?.PolicyID ||
      result.policyId ||
      '-';

    const riderCount =
      Number(
        result.riderCount || 0

  } catch (error) {

    console.error(
      'submitCreatePolicy error:',
      error

    messageBox.textContent =

function addPolicyYears(dateString, years) {

  if (!dateString) {
    return '';
  }

  const parts =
    String(dateString)
      .split('-')
      .map(Number);

  if (
    parts.length !== 3 ||
    parts.some(
      value => !Number.isFinite(value)
    )
  ) {
    return '';
  }

  const year =
    parts[0];

  const month =
    parts[1];

  const day =
    parts[2];

  const targetYear =
    year + Number(years || 0);

  // กรณี 29 ก.พ. → ถ้าปลายทางไม่ใช่ leap year
  // ให้ใช้วันสุดท้ายของเดือนกุมภาพันธ์
  const lastDay =
    new Date(
      targetYear,
      month,
      0
    ).getDate();

  const targetDay =
    Math.min(
      day,
      lastDay
    );

  return [
    targetYear,
    String(month).padStart(2, '0'),
    String(targetDay).padStart(2, '0')
  ].join('-');
}

function addPolicyMonths(dateString, months) {

  if (!dateString) {
    return '';
  }

  const parts =
    String(dateString)
      .split('-')
      .map(Number);

  if (
    parts.length !== 3 ||
    parts.some(
      value => !Number.isFinite(value)
    )
  ) {
    return '';
  }

  const year =
    parts[0];

  const month =
    parts[1];

  const day =
    parts[2];

  const totalMonths =
    (month - 1) +
    Number(months || 0);

  const targetYear =
    year +
    Math.floor(
      totalMonths / 12
    );

  const targetMonth =
    (totalMonths % 12) + 1;

  const lastDay =
    new Date(
      targetYear,
      targetMonth,
      0
    ).getDate();

  const targetDay =
    Math.min(
      day,
      lastDay
    );

  return [
    targetYear,
    String(targetMonth).padStart(2, '0'),
    String(targetDay).padStart(2, '0')
  ].join('-');
}

function calculatePolicyDates(options = {}) {

  const effectiveDate =
    String(
      options.effectiveDate || ''
    ).trim();

  const premiumTermYears =
    Number(
      options.premiumTermYears || 0
    );
  console.log(premiumTermYears);

  const coverageMode =
    String(
      options.coverageMode || ''
    )
      .trim()
      .toUpperCase();

  const coverageToAge =
    Number(
      options.coverageToAge || 0
    );

  const coverageTermYears =
    Number(
      options.coverageTermYears || 0
    );

  const paymentMode =
    String(
      options.paymentMode || 'YEARLY'
    )
      .trim()
      .toUpperCase();

  const birthDate =
    String(
      options.birthDate || ''
    ).trim();


  let premiumEndDate = '';
  let expiryDate = '';
  let nextPaymentDate = '';


  // ==========================================
  // 1. Premium End Date
  // ==========================================

  if (
    effectiveDate &&
    premiumTermYears > 0
  ) {

    premiumEndDate =
      addPolicyYears(
        effectiveDate,
        premiumTermYears
      );

    if (premiumEndDate) {

      const date =
        new Date(
          premiumEndDate +
          'T00:00:00'
        );

      date.setDate(
        date.getDate() - 1
      );

      premiumEndDate =
        [
          date.getFullYear(),
          String(
            date.getMonth() + 1
          ).padStart(2, '0'),
          String(
            date.getDate()
          ).padStart(2, '0')
        ].join('-');
    }
  }


  // ==========================================
  // 2. Expiry Date
  // ==========================================

  if (
    coverageMode === 'AGE' &&
    birthDate &&
    coverageToAge > 0
  ) {

    // วันเกิด + อายุที่กำหนด
    const birthdayAtTargetAge =
      addPolicyYears(
        birthDate,
        coverageToAge
      );

    if (birthdayAtTargetAge) {

      const date =
        new Date(
          birthdayAtTargetAge +
          'T00:00:00'
        );

      // สิ้นสุดคุ้มครอง = วันก่อนวันเกิดครบอายุ
      date.setDate(
        date.getDate() - 1
      );

      expiryDate =
        [
          date.getFullYear(),
          String(
            date.getMonth() + 1
          ).padStart(2, '0'),
          String(
            date.getDate()
          ).padStart(2, '0')
        ].join('-');
    }

  }
  else if (
    coverageMode === 'TERM' &&
    effectiveDate &&
    coverageTermYears > 0
  ) {

    expiryDate =
      addPolicyYears(
        effectiveDate,
        coverageTermYears
      );

    if (expiryDate) {

      const date =
        new Date(
          expiryDate +
          'T00:00:00'
        );

      date.setDate(
        date.getDate() - 1
      );

      expiryDate =
        [
          date.getFullYear(),
          String(
            date.getMonth() + 1
          ).padStart(2, '0'),
          String(
            date.getDate()
          ).padStart(2, '0')
        ].join('-');
    }
  }


  // ==========================================
  // 3. Next Payment Date
  // ==========================================

  if (effectiveDate) {

    switch (paymentMode) {

      case 'MONTHLY':

        nextPaymentDate =
          addPolicyMonths(
            effectiveDate,
            1
          );

        break;


      case 'QUARTER':

        nextPaymentDate =
          addPolicyMonths(
            effectiveDate,
            3
          );

        break;


      case 'HALF_YEAR':

        nextPaymentDate =
          addPolicyMonths(
            effectiveDate,
            6
          );

        break;


      case 'YEARLY':

      default:

        nextPaymentDate =
          addPolicyMonths(
            effectiveDate,
            12
          );

        break;
    }
  }


  return {

    PremiumEndDate:
      premiumEndDate,

    ExpiryDate:
      expiryDate,

    NextPaymentDate:
      nextPaymentDate

  };
}

function openEditPolicy(policyId) {
  const id = String(policyId || '').trim();

  if (!id) {
    console.error('PolicyID is empty');
    return;
  }

  const customerData = selectedCustomer || {};
  const policies = Array.isArray(customerData.policies)
    ? customerData.policies
    : [];

  const policy = policies.find(
    item =>
      String(item.PolicyID || '').trim() === id
  );

  if (!policy) {
    console.error('Policy not found:', id);
    alert('ไม่พบข้อมูลกรมธรรม์');
    return;
  }

  selectedPolicyId = id;

  const customer =
    selectedCustomer?.customer || {};

  const family =
    Array.isArray(selectedCustomer?.family)
      ? selectedCustomer.family
      : [];

  const familyMemberId =
    String(
      policy.FamilyMemberID || ''
    ).trim();

  // =====================================================
  // BirthDate ของผู้เอาประกัน
  // =====================================================

  let birthDate =
    String(
      customer.BirthDate || ''
    ).trim();

  if (familyMemberId) {
    const member =
      family.find(
        item =>
          String(
            item.FamilyMemberID || ''
          ).trim() === familyMemberId
      );

    if (member?.BirthDate) {
      birthDate =
        String(
          member.BirthDate
        ).trim();
    }
  }

  // =====================================================
  // วันที่
  // =====================================================

  const effectiveDate = policy.EffectiveDate
    ? formatDateInput(policy.EffectiveDate)
    : '';
  
  const premiumEndDate = policy.PremiumEndDate
    ? formatDateInput(policy.PremiumEndDate)
    : '';
  
  const expiryDate = policy.ExpiryDate
    ? formatDateInput(policy.ExpiryDate)
    : '';

  console.log('EDIT POLICY RAW:', policy);
  console.log('EffectiveDate RAW:', policy.EffectiveDate);
  console.log('PremiumEndDate RAW:', policy.PremiumEndDate);
  console.log('EffectiveDate FORMATTED:', effectiveDate);
  console.log('PremiumEndDate FORMATTED:', premiumEndDate);
  const premiumTermYears = calculatePolicyYearsBetween(
    effectiveDate,
    premiumEndDate
  );

  console.log('PremiumTermYears CALCULATED:', premiumTermYears);

  // =====================================================
  // รูปแบบการคุ้มครอง
  //
  // ถ้ามี BirthDate และ ExpiryDate
  // และ ExpiryDate ตรงกับวันก่อนวันเกิดของอายุเต็ม
  // ให้ถือเป็น AGE
  //
  // ถ้าไม่ใช่ ให้ถือเป็น TERM
  // =====================================================

  let coverageMode = 'TERM';
  let coverageToAge = '';
  let coverageTermYears = '';

  if (
    birthDate &&
    expiryDate
  ) {
    const ageResult =
      detectCoverageToAge(
        birthDate,
        expiryDate
      );

    if (ageResult) {
      coverageMode = 'AGE';
      coverageToAge =
        ageResult.age;
    }
  }

  // =====================================================
  // ถ้าไม่ใช่ AGE → คำนวณ TERM
  // =====================================================

  if (
    coverageMode === 'TERM' &&
    effectiveDate &&
    expiryDate
  ) {
    coverageTermYears =
      calculatePolicyYearsBetween(
        effectiveDate,
        expiryDate
      );
  }

  // =====================================================
  // State
  // =====================================================

  createPolicyCustomerId =
    String(
      policy.CustomerID ||
      customer.CustomerID ||
      ''
    ).trim();

  createPolicyStep = 1;

  createPolicyData = {
    PolicyID:
      policy.PolicyID || '',

    CustomerID:
      policy.CustomerID || '',

    FamilyMemberID:
      familyMemberId,

    PolicyNo:
      policy.PolicyNo || '',

    PlanID:
      policy.PlanID || '',

    PlanName:
      policy.PlanName || '',

    PolicyType:
      String(
        policy.PolicyType || 'LIFE'
      )
        .trim()
        .toUpperCase(),

    PolicyStatus:
      policy.PolicyStatus || 'ACTIVE',

    EffectiveDate:
      effectiveDate,

    PremiumEndDate:
      premiumEndDate,

    ExpiryDate:
      expiryDate,

    PaymentMode:
      policy.PaymentMode || 'YEARLY',

    AnnualPremium:
      policy.AnnualPremium ?? '',

    NextPaymentDate:
      policy.NextPaymentDate
        ? formatDateInput(
            policy.NextPaymentDate
          )
        : '',

    // ==========================
    // ข้อมูลสำหรับ Form
    // ==========================

    PremiumTermYears:
      premiumTermYears,

    CoverageMode:
      coverageMode,

    CoverageToAge:
      coverageToAge,

    CoverageTermYears:
      coverageTermYears,

    // ==========================
    // ข้อมูลอ้างอิง
    // ==========================

    BirthDate:
      birthDate,

    customer:
      customer,

    family:
      family,

    LifeSumAssured:
      '',

    SavingsProgress:
      null
  };

  newPolicyRiders = [];

  editingRiderIndex = -1;

  renderCreatePolicyForm();
}

function calculatePolicyYearsBetween(
  startDate,
  endDate
) {
  if (
    !startDate ||
    !endDate
  ) {
    return '';
  }

  const start =
    new Date(
      String(startDate) +
      'T00:00:00'
    );

  const end =
    new Date(
      String(endDate) +
      'T00:00:00'
    );

  if (
    isNaN(start.getTime()) ||
    isNaN(end.getTime())
  ) {
    return '';
  }

  let years =
    end.getFullYear() -
    start.getFullYear();

  const anniversary =
    new Date(
      start.getFullYear() + years,
      start.getMonth(),
      start.getDate()
    );

  if (
    anniversary > end
  ) {
    years--;
  }

  return Math.max(
    0,
    years
  );
}

function detectCoverageToAge(
  birthDate,
  expiryDate
) {
  if (
    !birthDate ||
    !expiryDate
  ) {
    return null;
  }

  const birth =
    new Date(
      String(birthDate) +
      'T00:00:00'
    );

  const expiry =
    new Date(
      String(expiryDate) +
      'T00:00:00'
    );

  if (
    isNaN(birth.getTime()) ||
    isNaN(expiry.getTime())
  ) {
    return null;
  }

  const candidateAge =
    expiry.getFullYear() -
    birth.getFullYear() +
    1;

  const birthdayAtAge =
    new Date(
      birth.getFullYear() +
        candidateAge,
      birth.getMonth(),
      birth.getDate()
    );

  birthdayAtAge.setDate(
    birthdayAtAge.getDate() - 1
  );

  if (
    birthdayAtAge.getTime() ===
    expiry.getTime()
  ) {
    return {
      age: candidateAge
    };
  }

  return null;
}

function formatDateInput(value) {
  if (!value) return '';

  const date = new Date(value);

  if (isNaN(date.getTime())) {
    return String(value).substring(0, 10);
  }

  return [
    date.getFullYear(),
    String(date.getMonth() + 1).padStart(2, '0'),
    String(date.getDate()).padStart(2, '0')
  ].join('-');
}
